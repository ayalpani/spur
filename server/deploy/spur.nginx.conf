server {
    listen 80;
    listen [::]:80;
    server_name spur.yalpani.com;

    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name spur.yalpani.com;

    access_log off;
    ssl_certificate /etc/letsencrypt/live/spur.yalpani.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spur.yalpani.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SpurSSL:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Cache-Control "no-store" always;

    location / {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://spur-items:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
    }
}
